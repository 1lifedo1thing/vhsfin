<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Jellyfin library, rewound. A cozy shelf of VHS tapes, a glowing CRT, and your favorite movies. Just press play.">
  <meta name="theme-color" content="#07090B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VHSFin">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="icons/Icon-512.png" as="image">
  <title>VHSFin · Movie night, rewound.</title>
  <style>
    html, body { height: 100%; margin: 0; background: #07090b; }
    #vhs-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; text-align: center; color: #e6ecee;
      background: radial-gradient(ellipse at 50% 40%, #14191d 0%, #07090b 55%, #030404 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      transition: opacity 280ms ease;
    }
    #vhs-splash.fade-out { opacity: 0; pointer-events: none; }
    .brand-icon { width: clamp(120px, 26vw, 188px); height: auto; border-radius: 23%; box-shadow: 0 24px 60px #0009; }
    .wordmark { margin: 30px 0 8px; font-size: clamp(30px, 7vw, 44px); font-weight: 900; letter-spacing: .08em; }
    .tagline { margin: 0; font-size: 15px; color: #98a4ab; letter-spacing: .02em; }
    .status { margin-top: 36px; display: flex; gap: 10px; align-items: center; font: 11px ui-monospace, monospace; letter-spacing: .18em; color: #6fe0e6; }
    .led { width: 6px; height: 6px; border-radius: 50%; background: #6fe0e6; box-shadow: 0 0 12px #6fe0e6; animation: breathe 1.8s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .35; } }
    #load-help { max-width: 340px; margin-top: 20px; color: #98a4ab; font-size: 13px; line-height: 1.6; }
    #load-help button { margin-top: 8px; padding: 10px 20px; border: 1px solid #6fe0e666; border-radius: 10px; background: #6fe0e615; color: #6fe0e6; font: inherit; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .led { animation: none; } #vhs-splash { transition: none; } }
  </style>
</head>
<body>
  <div id="vhs-splash" role="status" aria-live="polite">
    <img class="brand-icon" src="icons/Icon-512.png" width="188" height="188" alt="VHS cassette with a play button">
    <h1 class="wordmark">VHSFIN</h1>
    <p class="tagline">Movie night, rewound.</p>
    <div class="status"><span class="led" aria-hidden="true"></span><span id="load-status">WARMING UP THE VCR</span></div>
    <div id="load-help" hidden>
      This is taking longer than expected. Check your connection, then give it another try.<br>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
    <noscript><p>Turn on JavaScript to load your living room.</p></noscript>
  </div>
  <script>
    const slowLoad = setTimeout(function () {
      const help = document.getElementById('load-help');
      if (help) help.hidden = false;
    }, 25000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(slowLoad);
      const splash = document.getElementById('vhs-splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(function () { splash.remove(); }, 320);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
