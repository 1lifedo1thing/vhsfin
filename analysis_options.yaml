include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**

linter:
  rules:
    # Async correctness
    - unawaited_futures
    - close_sinks
    # Type safety around decoded JSON
    - avoid_dynamic_calls
    # Consistency
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - avoid_redundant_argument_values
    - unnecessary_parenthesis
    - unnecessary_lambdas
    - use_colored_box
    - use_decorated_box
    - avoid_print
