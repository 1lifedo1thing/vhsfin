name: vhsfin
description: A small Jellyfin client with VHS shelves and a living-room player.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  fancy_overlay: ^0.1.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  google_fonts: ^8.2.1
  web: ^1.1.1
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  cached_network_image_platform_interface: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon_1024.png
    - assets/branding/crt-90s.png
    - assets/branding/walnut.jpg
    - assets/sounds/vhs_insert.ogg
    - assets/sounds/vhs_eject.ogg
    - assets/sounds/vhs_ff.ogg
    - assets/sounds/vhs_rew.ogg
