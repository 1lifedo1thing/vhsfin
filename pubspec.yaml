name: vhsfin
description: A small Jellyfin client with VHS shelves and a living-room player.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  fancy_overlay: ^0.1.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  web: ^1.1.1
  vector_math: ^2.1.4
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  cached_network_image_platform_interface: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon_1024.png
    - assets/crts.png
    - assets/knob.png
    - assets/knob2.png
    - assets/branding/crt-90s.png
    - assets/branding/crt-icon-cutout.png
    - assets/branding/walnut.jpg
    - assets/sounds/vhs_insert.ogg
    - assets/sounds/vhs_eject.ogg
    - assets/sounds/vhs_ff.ogg
    - assets/sounds/vhs_rew.ogg
    - assets/sounds/ui_tick_1.wav
    - assets/sounds/ui_tick_2.wav
    - assets/sounds/ui_tick_3.wav
    - assets/sounds/ui_key_1.wav
    - assets/sounds/ui_key_2.wav
    - assets/sounds/ui_key_3.wav
    - assets/sounds/ui_switch_1.wav
    - assets/sounds/ui_switch_2.wav
    - assets/sounds/ui_switch_3.wav
    - assets/sounds/ui_sheet_up.wav
    - assets/sounds/ui_sheet_down.wav
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Bungee
      fonts:
        - asset: assets/fonts/Bungee-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
