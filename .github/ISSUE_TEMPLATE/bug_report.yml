name: Bug report
description: Something in VHSFin doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove passwords, tokens, authorization headers, private server addresses, and full stream URLs before posting. Security problems go to the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Choose …
        3. …
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and device
      placeholder: Web (Chrome 131, macOS), Android 15 (Pixel 8), iOS 18 …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VHSFin version or commit
    validations:
      required: true
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin server version
  - type: textarea
    id: media
    attributes:
      label: For playback problems
      description: Container and codecs of the file, and whether Jellyfin was transcoding.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Redact anything private first.
